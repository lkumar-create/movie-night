<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<title>REFLEX — Driving Scene Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --klein: #002FA7; --acid: #F5E642; --ink: #0D0D0D;
  --white: #FFFFFF; --red: #FF3A1F; --green: #00C96A;
}
*,*::before,*::after { margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent; }
html { height:100%; touch-action:manipulation; }
body {
  height:100%; min-height:100dvh; background:var(--ink); color:var(--white);
  font-family:'DM Mono',monospace; -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
body::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:0.04;
}

/* SCREENS */
.screen { position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden; }
.screen.active { display:flex; }

/* OVERLAYS */
.flash { position:fixed;inset:0;pointer-events:none;z-index:500; }
.flash.go  { animation:fGo  .4s ease-out forwards; }
.flash.bad { animation:fBad .4s ease-out forwards; }
@keyframes fGo  { 0%{background:rgba(0,201,106,.25);opacity:1}100%{opacity:0} }
@keyframes fBad { 0%{background:rgba(255,58,31,.25);opacity:1}100%{opacity:0} }
.pop {
  position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(.4);
  font-family:'Bebas Neue';font-size:clamp(52px,16vw,84px);letter-spacing:.1em;
  pointer-events:none;z-index:600;opacity:0;
}
.pop.show { animation:popAnim .5s cubic-bezier(.34,1.56,.64,1) forwards; }
.pop.ok { color:var(--green); } .pop.bad { color:var(--red); }
@keyframes popAnim {
  0%  { transform:translate(-50%,-50%) scale(.4);opacity:1; }
  60% { transform:translate(-50%,-50%) scale(1.1);opacity:1; }
  100%{ transform:translate(-50%,-65%) scale(1);opacity:0; }
}

/* ── INTRO ── */
#intro {
  align-items:center;justify-content:center;gap:0;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  overflow-y:auto;
}
.intro-mark { font-family:'Bebas Neue';font-size:clamp(80px,22vw,148px);letter-spacing:.06em;line-height:.85;text-align:center; }
.intro-sub { font-family:'Bebas Neue';font-size:clamp(15px,4.5vw,28px);background:var(--acid);color:var(--ink);padding:3px 18px;letter-spacing:.18em;margin-top:6px; }
.intro-body { font-size:clamp(9px,2.4vw,11px);color:#555;letter-spacing:.1em;text-transform:uppercase;margin:16px 0 20px;text-align:center;max-width:300px;line-height:2; }
.mode-row { display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(420px,92vw);margin-bottom:14px; }
.mcard {
  background:transparent;border:1px solid #222;color:var(--white);
  font-family:'DM Mono',monospace;font-size:clamp(9px,2.2vw,10px);
  letter-spacing:.06em;text-transform:uppercase;
  padding:clamp(12px,3vw,16px) 12px;cursor:pointer;text-align:left;
  transition:all .15s;line-height:1.6;min-height:88px;
}
.mcard:active { background:#060618;border-color:var(--klein); }
@media(hover:hover){.mcard:hover{border-color:var(--klein);background:#060618;}}
.mcard.sel { border-color:var(--acid);background:#0a0a20; }
.mcard-icon { font-size:20px;display:block;margin-bottom:5px; }
.mcard-name { font-family:'Bebas Neue';font-size:clamp(16px,4vw,20px);letter-spacing:.1em;display:block; }
.go-btn {
  background:var(--acid);color:var(--ink);border:none;
  font-family:'Bebas Neue';font-size:clamp(20px,5vw,26px);letter-spacing:.2em;
  padding:16px 0;cursor:pointer;transition:all .12s;
  width:min(420px,92vw);min-height:56px;
}
.go-btn:active { background:var(--white);transform:scale(.98); }
@media(hover:hover){.go-btn:hover{background:var(--white);}}

/* ── HUD ── */
.hud {
  display:flex;align-items:center;
  padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));
  border-bottom:1px solid #1a1a1a;background:#050505;flex-shrink:0;z-index:10;gap:8px;
}
.hud-col { text-align:center;min-width:44px;flex-shrink:0; }
.hud-label { font-size:7px;letter-spacing:.2em;text-transform:uppercase;color:#444; }
.hud-val { font-family:'Bebas Neue';font-size:clamp(22px,6vw,28px);line-height:1.1;color:var(--white); }
.hud-val.acid { color:var(--acid); } .hud-val.blue { color:#4d7fff; }
.hud-progress { flex:1;display:flex;flex-direction:column;gap:5px;min-width:0; }
.progress-dots { display:flex;gap:3px;justify-content:center;flex-wrap:wrap; }
.dot { width:6px;height:6px;border-radius:50%;background:#222;transition:background .3s;flex-shrink:0; }
.dot.done-correct { background:var(--green); }
.dot.done-wrong   { background:var(--red); }
.dot.current { background:var(--acid);animation:pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.35} }
.timer-track { height:3px;background:#1a1a1a;overflow:hidden;border-radius:2px; }
.timer-fill { height:100%;background:var(--acid);transition:width linear,background .3s; }

/* ── SCENE WRAP ── */
.scene-wrap {
  flex:1;display:flex;flex-direction:column;align-items:center;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:14px 12px;
  padding-bottom:max(90px,calc(env(safe-area-inset-bottom) + 90px));
  gap:12px;
}

/* Road scene */
.road-scene {
  width:100%;max-width:560px;flex-shrink:0;
  background:#1e1e1e;border:1px solid #2a2a2a;position:relative;
  min-height:clamp(120px,28vw,175px);border-radius:2px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.road-stripe {
  position:absolute;left:50%;transform:translateX(-50%);
  top:0;bottom:0;width:4px;opacity:.3;
  background:repeating-linear-gradient(to bottom,#F5E642 0,#F5E642 18px,transparent 18px,transparent 36px);
}
.signs-row {
  position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(6px,3vw,28px);padding:clamp(12px,3vw,20px) 10px clamp(6px,2vw,12px);
  flex-wrap:wrap;width:100%;
}
.sign-post-wrap {
  display:flex;flex-direction:column;align-items:center;
  animation:signDrop .35s cubic-bezier(.34,1.2,.64,1) both;
}
.sign-post-wrap:nth-child(2){animation-delay:.06s;}
.sign-post-wrap:nth-child(3){animation-delay:.12s;}
.sign-post-wrap:nth-child(4){animation-delay:.18s;}
@keyframes signDrop{from{transform:translateY(-14px) scale(.88);opacity:0}to{transform:none;opacity:1}}
.sign-img { display:block; }
.post { width:3px;height:clamp(14px,3vw,24px);background:linear-gradient(to bottom,#888,#444); }

/* Scale down signs on very small screens */
@media(max-width:380px){
  .sign-img { transform:scale(.72);transform-origin:bottom center; }
  .sign-post-wrap { margin-bottom:-10px; }
}
@media(min-width:381px) and (max-width:440px){
  .sign-img { transform:scale(.84);transform-origin:bottom center; }
  .sign-post-wrap { margin-bottom:-6px; }
}

/* Question */
.question-sub { font-size:8px;color:#3a3a3a;letter-spacing:.2em;text-transform:uppercase;text-align:center;flex-shrink:0; }
.question-text {
  font-family:'Playfair Display',serif;font-size:clamp(15px,4.2vw,20px);
  font-weight:700;text-align:center;max-width:540px;line-height:1.45;color:var(--white);flex-shrink:0;
}
.question-text em { color:var(--acid);font-style:normal; }

/* Choices — always 1 col on mobile, 2 col on wider */
.choices { display:grid;gap:8px;width:100%;max-width:560px;grid-template-columns:1fr;flex-shrink:0; }
@media(min-width:500px){ .choices:not(.single-col) { grid-template-columns:1fr 1fr; } }

.choice {
  background:#0f0f0f;border:1px solid #252525;color:var(--white);
  font-family:'DM Mono',monospace;font-size:clamp(12px,3vw,13px);letter-spacing:.03em;
  padding:clamp(13px,3.5vw,17px) 14px;cursor:pointer;text-align:left;line-height:1.55;
  transition:border-color .1s,background .1s;min-height:52px;
  display:flex;align-items:center;
}
.choice:active:not(:disabled) { background:#0a0a1e;border-color:var(--klein); }
@media(hover:hover){.choice:hover:not(:disabled){background:#0a0a1e;border-color:var(--klein);}}
.choice.correct { background:rgba(0,201,106,.1)!important;border-color:var(--green)!important;color:var(--green)!important; }
.choice.wrong   { background:rgba(255,58,31,.1)!important;border-color:var(--red)!important;color:var(--red)!important; }
.choice.show    { border-color:#252525!important;color:#3a3a3a!important; }
.choice-key {
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;flex-shrink:0;
  background:#1e1e1e;font-size:9px;border-radius:2px;margin-right:10px;letter-spacing:0;
}

/* Explanation */
.explain {
  background:#060610;border:1px solid #12122e;border-left:3px solid var(--klein);
  padding:12px 14px;max-width:560px;width:100%;
  font-size:clamp(11px,2.8vw,12px);line-height:1.85;color:#888;
  display:none;flex-shrink:0;
}
.explain.show { display:block;animation:fadeUp .3s ease both; }
.explain strong { color:var(--acid);font-weight:500; }
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* Fixed NEXT button at bottom */
.next-footer {
  position:fixed;bottom:0;left:0;right:0;
  padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));
  background:#050505;border-top:1px solid #1a1a1a;
  display:none;z-index:50;
}
.next-footer.show { display:block; }
.next-footer button {
  width:100%;background:var(--acid);color:var(--ink);
  border:none;font-family:'Bebas Neue';font-size:clamp(18px,5vw,22px);
  letter-spacing:.2em;padding:14px;cursor:pointer;
  transition:background .1s;min-height:50px;
}
.next-footer button:active { background:var(--white); }
@media(hover:hover){.next-footer button:hover{background:var(--white);}}

/* ── RESULTS ── */
#results {
  align-items:center;justify-content:center;gap:0;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
  overflow-y:auto;
}
.res-title { font-family:'Bebas Neue';font-size:clamp(38px,11vw,74px);letter-spacing:.08em;line-height:.9;text-align:center; }
.res-title span { color:var(--acid); }
.res-score { font-family:'Bebas Neue';font-size:clamp(56px,17vw,108px);line-height:1;text-align:center;margin-top:10px; }
.res-score em { color:var(--acid);font-style:normal; }
.res-bar { width:min(300px,86vw);height:3px;background:#1a1a1a;margin:14px auto 0; }
.res-fill { height:100%;background:var(--acid);transition:width 1s ease .4s; }
.res-verdict { font-family:'Playfair Display',serif;font-size:clamp(13px,3.5vw,17px);font-weight:700;text-align:center;max-width:340px;color:var(--white);margin-top:18px;line-height:1.5; }
.res-stats { font-size:10px;color:#444;letter-spacing:.1em;text-align:center;margin-top:8px; }
.replay { background:var(--acid);color:var(--ink);border:none;font-family:'Bebas Neue';font-size:clamp(18px,5vw,22px);letter-spacing:.2em;padding:15px 48px;cursor:pointer;transition:all .12s;margin-top:24px;min-height:52px; }
.replay:active { background:var(--white); }
@media(hover:hover){.replay:hover{background:var(--white);}}
.home-link { background:transparent;color:#333;border:1px solid #1a1a1a;font-family:'DM Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:12px 28px;cursor:pointer;transition:all .12s;margin-top:12px;min-height:44px; }
.home-link:active { color:#888;border-color:#444; }
</style>
</head>
<body>

<div class="flash" id="flash"></div>
<div class="pop" id="pop"></div>

<!-- INTRO -->
<div class="screen active" id="intro">
  <div class="intro-mark">REFLEX</div>
  <div class="intro-sub">SCENE TRAINER</div>
  <p class="intro-body">Read the full sign cluster.<br>React before the clock does.</p>
  <div class="mode-row">
    <button class="mcard sel" onclick="setMode('all',this)">
      <span class="mcard-icon">🛣️</span><span class="mcard-name">Full Mix</span>All scene types
    </button>
    <button class="mcard" onclick="setMode('intersect',this)">
      <span class="mcard-icon">✋</span><span class="mcard-name">Intersection</span>Stop, yield, lights
    </button>
    <button class="mcard" onclick="setMode('highway',this)">
      <span class="mcard-icon">⚡</span><span class="mcard-name">Highway</span>Speed, merge, pass
    </button>
    <button class="mcard" onclick="setMode('zone',this)">
      <span class="mcard-icon">🏘️</span><span class="mcard-name">Zone Reads</span>School, work, park
    </button>
  </div>
  <button class="go-btn" onclick="startQuiz()">START SESSION →</button>
</div>

<!-- QUIZ -->
<div class="screen" id="quiz">
  <div class="hud">
    <div class="hud-col">
      <div class="hud-label">Score</div>
      <div class="hud-val acid" id="hScore">0</div>
    </div>
    <div class="hud-progress">
      <div class="progress-dots" id="dots"></div>
      <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
    </div>
    <div class="hud-col">
      <div class="hud-label">Streak</div>
      <div class="hud-val blue" id="hStreak">0</div>
    </div>
  </div>
  <div class="scene-wrap" id="sceneWrap"></div>
  <div class="next-footer" id="nextFooter">
    <button onclick="advance()">NEXT SCENE →</button>
  </div>
</div>

<!-- RESULTS -->
<div class="screen" id="results">
  <div class="res-title">SESSION<br><span>COMPLETE</span></div>
  <div class="res-score" id="rScore">—</div>
  <div class="res-bar"><div class="res-fill" id="rFill" style="width:0"></div></div>
  <div class="res-verdict" id="rVerdict"></div>
  <div class="res-stats" id="rStats"></div>
  <button class="replay" onclick="startQuiz()">TRAIN AGAIN</button>
  <button class="home-link" onclick="goHome()">← Change mode</button>
</div>

<script>
const S = {
  // Regulatory — Octagonal
  stop: (w=90) => `<svg class="sign-img" width="${w}" height="${w}" viewBox="0 0 100 100">
    <polygon points="29,4 71,4 96,29 96,71 71,96 29,96 4,71 4,29" fill="#BD0000" stroke="white" stroke-width="3.5"/>
    <polygon points="29,4 71,4 96,29 96,71 71,96 29,96 4,71 4,29" fill="none" stroke="white" stroke-width="1.5" transform="translate(50,50) scale(0.86) translate(-50,-50)"/>
    <text x="50" y="61" font-family="'Highway Gothic','Arial Black',sans-serif" font-weight="900" font-size="18" fill="white" text-anchor="middle" letter-spacing="2.5">STOP</text>
  </svg>`,

  // Regulatory — Triangle (inverted)
  yield: (w=90) => `<svg class="sign-img" width="${w}" height="${Math.round(w*0.87)}" viewBox="0 0 100 87">
    <polygon points="50,3 97,84 3,84" fill="white" stroke="#BD0000" stroke-width="5"/>
    <polygon points="50,13 90,81 10,81" fill="none" stroke="#BD0000" stroke-width="3"/>
    <text x="50" y="73" font-family="'Highway Gothic','Arial Black',sans-serif" font-weight="900" font-size="15" fill="#BD0000" text-anchor="middle" letter-spacing="1">YIELD</text>
  </svg>`,

  // Speed Limit — White rectangle
  speed: (n, w=72) => `<svg class="sign-img" width="${w}" height="${Math.round(w*1.3)}" viewBox="0 0 72 94">
    <rect x="2" y="2" width="68" height="90" rx="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="6" y="6" width="60" height="82" rx="2" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="36" y="28" font-family="'Highway Gothic','Arial Black',sans-serif" font-size="9.5" fill="#1a1a1a" text-anchor="middle" letter-spacing="0.5" font-weight="700">SPEED</text>
    <text x="36" y="40" font-family="'Highway Gothic','Arial Black',sans-serif" font-size="9.5" fill="#1a1a1a" text-anchor="middle" letter-spacing="0.5" font-weight="700">LIMIT</text>
    <text x="36" y="82" font-family="'Highway Gothic','Arial Black',sans-serif" font-size="44" fill="#1a1a1a" text-anchor="middle" font-weight="900">${n}</text>
  </svg>`,

  // Do Not Enter — Red circle white bar
  noEntry: (w=80) => `<svg class="sign-img" width="${w}" height="${w}" viewBox="0 0 80 80">
    <circle cx="40" cy="40" r="38" fill="#BD0000" stroke="white" stroke-width="3"/>
    <circle cx="40" cy="40" r="38" fill="none" stroke="white" stroke-width="1.5" r="32"/>
    <rect x="12" y="33" width="56" height="14" rx="2" fill="white"/>
    <text x="40" y="43.5" font-family="'Highway Gothic','Arial Black',sans-serif" font-size="8" fill="#BD0000" text-anchor="middle" font-weight="900" letter-spacing="0.5">DO NOT ENTER</text>
  </svg>`,

  // One Way
  oneWay: (w=100) => `<svg class="sign-img" width="${w}" height="${Math.round(w*0.38)}" viewBox="0 0 120 46">
    <rect x="0" y="0" width="120" height="46" fill="#1a1a1a"/>
    <text x="60" y="30" font-family="'Highway Gothic','Arial Black',sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="900" letter-spacing="3">ONE WAY</text>
    <polygon points="108,23 94,14 94,19 78,19 78,27 94,27 94,32" fill="white"/>
  </svg>`,

  // Wrong Way
  wrongWay: (w=100) => `<svg class="sign-img" width="${w}" height="${Math.round(w*0.38)}" viewBox="0 0 120 46">
    <rect x="0" y="0" width="120" height="46" fill="#BD0000"/>
    <text x="60" y="30" font-family="'Highway Gothic','Arial Black',sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="900" letter-spacing="2">WRONG WAY</text>
  </svg>`,

  // No Turn on Red
  noTurnRed: (w=80) => `<svg class="sign-img" width="${w}" height="${Math.round(w*1.05)}" viewBox="0 0 80 84">
    <rect x="2" y="2" width="76" height="80" rx="4" fill="white" stroke="#aaa" stroke-width="1.5"/>
    <circle cx="40" cy="34" r="22" fill="none" stroke="#BD0000" stroke-width="5"/>
    <line x1="24" y1="18" x2="56" y2="50" stroke="#BD0000" stroke-width="5"/>
    <path d="M34,20 Q40,12 48,20 L48,28 L52,22 L40,34 L28,22 L32,28 Z" fill="#1a1a1a"/>
    <text x="40" y="70" font-family="'Highway Gothic','Arial Black',sans-serif" font-size="7.5" fill="#BD0000" text-anchor="middle" font-weight="900" letter-spacing="0.3">NO TURN ON RED</text>
  </svg>`,

  // No Left Turn
  noLeftTurn: (w=80) => `<svg class="sign-img" width="${w}" height="${w}" viewBox="0 0 80 80">
    <rect x="2" y="2" width="76" height="76" rx="4" fill="white" stroke="#aaa" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="30" fill="none" stroke="#BD0000" stroke-width="5"/>
    <line x1="16" y1="16" x2="64" y2="64" stroke="#BD0000" stroke-width="5"/>
    <path d="M28,48 L28,36 Q28,24 40,24 L52,24" stroke="#1a1a1a" stroke-width="4" fill="none"/>
    <polygon points="24,38 32,26 36,38" fill="#1a1a1a"/>
  </svg>`,

  // No Parking
  noPark: (w=72) => `<svg class="sign-img" width="${w}" height="${Math.round(w*1.35)}" viewBox="0 0 72 97">
    <rect x="2" y="2" width="68" height="93" rx="4" fill="white" stroke="#BD0000" stroke-width="2.5"/>
    <text x="36" y="8" font-family="'Highway Gothic','Arial Black',sans-serif" font-size="6" fill="#BD0000" text-anchor="middle" dy="8" font-weight="900" letter-spacing="0.5">NO PARKING</text>
    <line x1="10" y1="50" x2="62" y2="50" stroke="#BD0000" stroke-width="3"/>
    <polygon points="7,44 7,56 2,50" fill="#BD0000"/>
    <polygon points="65,44 65,56 70,50" fill="#BD0000"/>
    <text x="36" y="84" font-family="'Highway Gothic','Arial Black',sans-serif" font-size="7" fill="#BD0000" text-anchor="middle" font-weight="900">ANY TIME</text>
  </svg>`,

  // Warning Diamond — generic
  warn: (label, w=82) => `<svg class="sign-img" width="${w}" height="${w}" viewBox="0 0 82 82">
    <rect x="11" y="11" width="60" height="60" rx="3" fill="#F5CD00" stroke="black" stroke-width="2.5" transform="rotate(45 41 41)"/>
    <text x="41" y="46" font-family="'Highway Gothic','Arial Black',sans-serif" font-size="${label.length > 8 ? 7 : 9}" fill="#1a1a1a" text-anchor="middle" font-weight="900" letter-spacing="0.3">${label}</text>
  </svg>`,

  // Warning — Pedestrian

// ── GAME ENGINE ──────────────────────────────────────────────
let mode = 'all';
let questions = [], qIdx = 0, score = 0, streak = 0;
let timerId = null, answered = false, timedOut = false;
let times = [], qStart = 0;
const QLIMIT = 12, QTIME = 8;

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.mcard').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
}
function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}
function getPool() {
  if (mode === 'all') return ALL_SCENES;
  const f = ALL_SCENES.filter(s => s.cat === mode || s.cat === 'all');
  return f.length >= 6 ? f : ALL_SCENES;
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() { clearTimer(); show('intro'); }

function startQuiz() {
  questions = shuffle(getPool()).slice(0, QLIMIT);
  qIdx = 0; score = 0; streak = 0; times = [];
  show('quiz');
  buildDots();
  loadQ();
}

function buildDots() {
  document.getElementById('dots').innerHTML =
    questions.map((_,i) => `<div class="dot" id="dot${i}"></div>`).join('');
}

function loadQ() {
  answered = false; timedOut = false;
  clearTimer();
  // Hide next button
  document.getElementById('nextFooter').classList.remove('show');

  const q = questions[qIdx];

  // Dots
  for (let i = 0; i < questions.length; i++) {
    const d = document.getElementById(`dot${i}`);
    d.className = 'dot' + (i < qIdx ? (d.dataset.res||'') : i===qIdx ? ' current' : '');
  }

  document.getElementById('hScore').textContent = score;
  document.getElementById('hStreak').textContent = streak;

  const keys = ['A','B','C','D'];
  document.getElementById('sceneWrap').innerHTML = `
    <div class="road-scene">
      <div class="road-stripe"></div>
      <div class="signs-row">${q.signs()}</div>
    </div>
    <div class="question-sub">— read the scene —</div>
    <div class="question-text">${q.q}</div>
    <div class="choices${q.choices.length <= 2 ? ' single-col' : ''}" id="choicesEl">
      ${q.choices.map((c,i) => `
        <button class="choice" onclick="pick(${i})">
          <span class="choice-key">${keys[i]}</span>${c}
        </button>`).join('')}
    </div>
    <div class="explain" id="explainEl">${q.explain}</div>
  `;

  // Keyboard (desktop)
  document.onkeydown = e => {
    if (!answered) {
      const map = {a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
      if (map[e.key.toLowerCase()] !== undefined) pick(map[e.key.toLowerCase()]);
    } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
      advance();
    }
  };

  // Scroll scene wrap to top
  document.getElementById('sceneWrap').scrollTop = 0;

  startTimer();
  qStart = Date.now();
}

function startTimer() {
  const fill = document.getElementById('timerFill');
  if (!fill) return;
  fill.style.transition = 'none';
  fill.style.width = '100%';
  fill.style.background = 'var(--acid)';
  setTimeout(() => {
    fill.style.transition = `width ${QTIME}s linear`;
    fill.style.width = '0%';
  }, 30);
  let elapsed = 0;
  timerId = setInterval(() => {
    elapsed += 100;
    const f = document.getElementById('timerFill');
    if (f && elapsed > QTIME * 600) f.style.background = '#FF3A1F';
    if (elapsed >= QTIME * 1000 && !answered) timeout();
  }, 100);
}

function clearTimer() { clearInterval(timerId); }

function timeout() {
  timedOut = true;
  flash('bad');
  const f = document.getElementById('timerFill');
  if (f) f.style.background = '#FF3A1F';
}

function pick(i) {
  if (answered) return;
  answered = true;
  clearTimer();
  times.push(Date.now() - qStart);
  const q = questions[qIdx];
  const ok = !timedOut && i === q.ans;
  document.querySelectorAll('.choice').forEach((b,j) => {
    b.disabled = true;
    if (j === q.ans) b.classList.add('correct');
    else if (j === i && !ok) b.classList.add('wrong');
    else b.classList.add('show');
  });
  if (ok) {
    score++; streak++;
    document.getElementById('hScore').textContent = score;
    document.getElementById('hStreak').textContent = streak;
    flash('go');
    const rt = times[times.length-1];
    popMsg(rt < 1800 ? '⚡ FAST' : streak >= 3 ? `🔥 ×${streak}` : '✓', 'ok');
    markDot('done-correct');
  } else {
    streak = 0;
    document.getElementById('hStreak').textContent = 0;
    flash('bad');
    popMsg(timedOut ? 'TOO SLOW' : '✗', 'bad');
    markDot('done-wrong');
  }
  // Show explanation
  const ex = document.getElementById('explainEl');
  if (ex) ex.classList.add('show');
  // Show next button after a beat
  setTimeout(() => {
    document.getElementById('nextFooter').classList.add('show');
  }, 350);
}

function markDot(cls) {
  const d = document.getElementById(`dot${qIdx}`);
  if (d) { d.dataset.res = ' ' + cls; d.className = 'dot ' + cls; }
}

function advance() {
  document.getElementById('nextFooter').classList.remove('show');
  clearTimer();
  qIdx++;
  if (qIdx >= questions.length) showResults();
  else loadQ();
}

function flash(type) {
  const el = document.getElementById('flash');
  el.className = 'flash';
  void el.offsetWidth;
  el.className = `flash ${type}`;
  setTimeout(() => el.className = 'flash', 500);
}

function popMsg(msg, cls) {
  const el = document.getElementById('pop');
  el.textContent = msg;
  el.className = `pop ${cls}`;
  void el.offsetWidth;
  el.className = `pop ${cls} show`;
  setTimeout(() => el.className = 'pop', 700);
}

function showResults() {
  show('results');
  const pct = Math.round(score / questions.length * 100);
  const avgMs = times.length ? Math.round(times.reduce((a,b) => a+b, 0) / times.length) : 0;
  document.getElementById('rScore').innerHTML = `<em>${score}</em> / ${questions.length}`;
  document.getElementById('rStats').textContent = `avg reaction · ${(avgMs/1000).toFixed(1)}s · ${pct}% accuracy`;
  setTimeout(() => { document.getElementById('rFill').style.width = pct + '%'; }, 80);
  const verdicts = [
    [90, "Scene scanning is becoming automatic. Your brain is building the right shortcuts."],
    [70, "Good pattern recognition. Repeat the categories you missed most."],
    [50, "You're learning the patterns. Daily reps will wire this in — go again."],
    [0,  "Every wrong answer is a sign to study. Read the explanations — then train again."]
  ];
  document.getElementById('rVerdict').textContent = verdicts.find(([min]) => pct >= min)[1];
}
</script>
